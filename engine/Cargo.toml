[package]
name = "slots-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `rng` only — no Pinocchio, no runtime. The program links the same crate with its `program`
# feature on; both halves draw from one stream.
casino-core = { git = "ssh://git@github.com/on-chain-studio/casino-core.git", rev = "5af2873b75ce16ab4372fce5899dc7f9af6d4339", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
