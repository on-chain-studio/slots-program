[package]
name = "slots-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []
# Leaves out the C ABI this crate exports on wasm32 for a client that loads the engine as its own
# .wasm module. A Rust wasm binary that links the engine as a library sets it: the ABI's unmangled
# names (`buffer`, …) are the same in every engine and would clash when two are linked together.
no-abi = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `rng` only — no Pinocchio, no runtime. The program links the same crate with its `program`
# feature on; both halves draw from one stream.
casino-core = { git = "ssh://git@github.com/on-chain-studio/casino-core.git", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
