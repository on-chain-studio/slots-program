[package]
name = "slots"
version = "0.1.0"
description = "Slot Machines"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pinocchio"]
# Solarium's `#[program]` generates the Pinocchio dispatch when the program crate has this on.
pinocchio = []
no-entrypoint = []

[dependencies]
solarium = { git = "https://github.com/sensorial-systems/solarium", rev = "85f77a6ac12ea26a65b5e950a0f463e898399939" }
solarium-program = { git = "https://github.com/sensorial-systems/solarium", rev = "85f77a6ac12ea26a65b5e950a0f463e898399939", default-features = false, features = [
    "pinocchio",
] }
pinocchio = { version = "0.11.2", default-features = false, features = [
    "alloc",
    "copy",
    "cpi",
    "account-resize",
] }
borsh = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# The chain half every game here shares: the vault, MagicBlock, the treasury instructions.
casino-core = { git = "ssh://git@github.com/on-chain-studio/casino-core.git" }
slots-engine = { path = "engine" }

[profile.release]
# "s" not "z": "z" pushes two deps past sBPF's 4096-byte stack frame (UB, not just slower).
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dev-dependencies]
# No mollusk-svm release is built on agave 4.3, which Solarium's solana-pubkey 4.4 needs.
mollusk-svm = { git = "https://github.com/anza-xyz/mollusk", rev = "f14a5ffc9f5c2c538cb32bcdada280dd75725bef" }
# The types mollusk-svm 0.15 and Solarium speak.
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4.4"
