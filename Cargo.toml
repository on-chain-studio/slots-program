[package]
name = "slots"
version = "0.1.0"
description = "Slot Machines"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pinocchio"]
# Solarium's `#[program]` generates the Pinocchio dispatch when the program crate has this on.
pinocchio = []
no-entrypoint = []

[dependencies]
solarium = { git = "https://github.com/sensorial-systems/solarium", rev = "21fda40a96b22cbd42a73efe62dafcd6377d750a" }
solarium-program = { git = "https://github.com/sensorial-systems/solarium", rev = "21fda40a96b22cbd42a73efe62dafcd6377d750a", default-features = false, features = [
    "pinocchio",
] }
pinocchio = { version = "0.11.2", default-features = false, features = [
    "alloc",
    "copy",
    "cpi",
    "account-resize",
] }
pinocchio-system = { version = "0.6", default-features = false }
borsh = { version = "1", features = ["derive"] }
slots-engine = { path = "engine" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[profile.release]
# "s" not "z": "z" pushes two deps past sBPF's 4096-byte stack frame (UB, not just slower).
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dev-dependencies]
mollusk-svm = "0.4"
solana-sdk = "3"
# mollusk-svm 0.4 speaks the 2.x types.
solana-account = "2.2"
solana-instruction = "2.2"
solana-pubkey = "2.2"
solana-log-collector = "2.3"
